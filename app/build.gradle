plugins { id 'com.android.application' }

dependencies { implementation 'org.jsoup:jsoup:1.18.3'; testImplementation 'junit:junit:4.13.2' }
android {
    namespace 'org.mediashelf.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'org.mediashelf.tv'
        minSdk 26
        targetSdk 32
        versionCode 20
        versionName '1.8.2'
    }
    // Private signer is supplied at build time by the private signing workflow.
    // Public CI builds must never publish packages signed by ephemeral runner keys.
    def externalSigner = System.getenv('MEDIASHELF_SIGNING_STORE')
    signingConfigs {
        mediaShelfStable {
            if (externalSigner != null && !externalSigner.trim().isEmpty()) {
                storeFile file(externalSigner)
                storePassword System.getenv('MEDIASHELF_SIGNING_PASSWORD')
                keyAlias 'mediashelftest'
                keyPassword System.getenv('MEDIASHELF_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (externalSigner != null && !externalSigner.trim().isEmpty()) {
                signingConfig signingConfigs.mediaShelfStable
            }
        }
        release { minifyEnabled false }
    }
    // Sideload prototype, not a Google Play submission.
    lint { disable 'ExpiredTargetSdkVersion' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
