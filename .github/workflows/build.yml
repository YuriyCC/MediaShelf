name: MediaShelf 2.7 APK and source build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease
      - name: Export unsigned build and Android signing utilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unsigned-package
          cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned-package/MediaShelf-2.7-unsigned.apk
          cp app/build/outputs/apk/debug/app-debug.apk unsigned-package/MediaShelf-2.7-DEBUG-installable.apk
          git archive --format=zip --output=unsigned-package/MediaShelf-2.7-source.zip HEAD
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" unsigned-package/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" unsigned-package/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: MediaShelf-2.7-APK-and-source
          path: unsigned-package/
          retention-days: 14
          if-no-files-found: error
