name: MediaShelf APK (prototype)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MediaShelf-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MediaShelf-0.1-test.apk
          if gh release view v0.1-test >/dev/null 2>&1; then
            gh release upload v0.1-test MediaShelf-0.1-test.apk --clobber
          else
            gh release create v0.1-test MediaShelf-0.1-test.apk --title "MediaShelf 0.1 — test APK" --notes "Тестовая Android TV сборка. Введите адрес Jackett, API ключ и адрес TorrServer в настройках приложения. Не протестировано на реальном телевизоре." --prerelease
          fi
      - name: Package exact source snapshot
        run: git archive --format=zip --output=MediaShelf-source.zip HEAD
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: MediaShelf-source
          path: MediaShelf-source.zip
          if-no-files-found: error
          retention-days: 14
